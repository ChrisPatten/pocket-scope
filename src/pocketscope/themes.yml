# Default theme definitions for PocketScope.
themes:
  atc_classic:
    palette:
      bg: "#0A0D0A"
      range.ring: "#1E4A1E"
      range.tick: "#2B6A2B"
      range.text: "#2B6A2B"
      map.border: "#2F742F"
      ac.level.fill: "#7CFF7C"
      ac.level.stroke: "#C8FFC8"
      ac.climb.fill: "#9AFF9A"
      ac.desc.fill: "#66E966"
      ac.pinned.stroke: "#FFFFFF"
      ac.focus.stroke: "#D6FFD6"
      label.text.primary: "#C8FFC8"
      label.text.dim: "#86D986"
      label.text.other: "#86D986"
      label.halo: "#051005"
      track.head: "#6EFF6E"
      airport.marker: "#2B6A2B"
      airport.text: "#2B6A2B"
      status.bg: "#051305"
      status.text: "#B9FFB9"
      infobar.accent: "#FFFFFF"
      vprof.bg: "#121212EB"
      vprof.border: "#2B6A2B"
      vprof.text: "#E0FFE0"
      vprof.muted: "#8AD88A"
      vprof.axis: "#3A6A3A"
      vprof.trace: "#6EFF6E"
      vprof.vs.pos: "#7CFF7C"
      vprof.vs.neg: "#D73C3C"
      vprof.vs.neutral: "#86D986"
      sector.line: "#80808064"
      sector.label: "#FFFFFFDC"
      status.badge.live.bg: "#00A000"
      status.badge.live.text: "#FFFFFF"
      status.badge.delay.bg: "#FFC857"
      status.badge.delay.text: "#000000"
      status.badge.stale.bg: "#C80000"
      status.badge.stale.text: "#FFFFFF"
    track_speed_scale:
      low:
        value: 0
        color: "#1F6B1F"
      stops:
        - value: 120
          color: "#3E9F3E"
        - value: 260
          color: "#6EFF6E"
        - value: 420
          color: "#C8FF6E"
      high:
        value: 560
        color: "#FFC857"

